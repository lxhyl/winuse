name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# The install steps run on Windows PowerShell 5.1 (shell: powershell) on purpose: that is what a
# stock Windows PC has. GitHub runs those steps with ErrorActionPreference=Stop, and 5.1 turns any
# stderr line of a native program into a terminating error, so each step sets Continue, checks
# exit codes itself, and ends with 'exit 0' (otherwise the last native exit code decides the step).

jobs:
  windows:
    name: Windows (unit tests + installer)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Parse every PowerShell script
        shell: powershell
        run: |
          $bad = 0
          Get-ChildItem -Recurse -Include *.ps1 | ForEach-Object {
            $errs = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errs) | Out-Null
            if ($errs.Count) { $bad++; Write-Host "::error file=$($_.FullName)::$($errs[0].Message)" }
          }
          if ($bad) { exit 1 }
          exit 0

      - name: Install scripts are plain ASCII
        shell: powershell
        run: |
          foreach ($f in 'site\install.ps1', 'scripts\install.ps1', 'scripts\install-task.ps1') {
            if ([IO.File]::ReadAllBytes((Resolve-Path $f)) | Where-Object { $_ -gt 127 }) { Write-Host "::error file=$f::non-ASCII byte"; exit 1 }
          }
          exit 0

      - name: Install with -NoTask into a temp dir
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          $dir = Join-Path $env:RUNNER_TEMP 'winuse'
          powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts\install.ps1 -Source $PWD -InstallDir $dir -NoTask
          if ($LASTEXITCODE) { Write-Host "::error::installer exited $LASTEXITCODE"; exit 1 }
          foreach ($p in 'venv\Scripts\python.exe', 'token.txt', 'host\winuse_host.py') {
            if (-not (Test-Path (Join-Path $dir $p))) { Write-Host "::error::missing $p"; exit 1 }
          }
          schtasks /query /tn winuse *> $null
          if ($LASTEXITCODE -eq 0) { Write-Host "::error::-NoTask registered a task"; exit 1 }
          exit 0

      - name: One-line bootstrap, offline from a source zip
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          git archive --format=zip --prefix=winuse-main/ -o "$env:RUNNER_TEMP\src.zip" HEAD
          if ($LASTEXITCODE) { Write-Host "::error::git archive failed"; exit 1 }
          $env:WINUSE_SOURCE_ZIP = "$env:RUNNER_TEMP\src.zip"
          $env:WINUSE_NOTASK = '1'
          $env:WINUSE_DIR = Join-Path $env:RUNNER_TEMP 'winuse-boot'
          try { iex ((Get-Content site\install.ps1) -join [char]10) } catch { Write-Host "::error::bootstrap: $($_.Exception.Message)"; exit 1 }
          if (-not (Test-Path (Join-Path $env:WINUSE_DIR 'venv\Scripts\python.exe'))) { Write-Host '::error::bootstrap did not create the venv'; exit 1 }
          if (Get-ChildItem $env:TEMP -Filter 'winuse-install-*' -ErrorAction SilentlyContinue) { Write-Host '::error::bootstrap left its temp dir behind'; exit 1 }
          exit 0

      - name: Host modules load in the installed venv
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          $dir = Join-Path $env:RUNNER_TEMP 'winuse'
          $py = Join-Path $dir 'venv\Scripts\python.exe'
          & $py (Join-Path $dir 'host\selfcheck.py')
          if ($LASTEXITCODE) { Write-Host "::error::selfcheck exited $LASTEXITCODE"; exit 1 }
          & $py -c "import sys; sys.path.insert(0, r'$dir\host'); import winuse_uia, winuse_host, winuse_py; print('host modules import OK')"
          if ($LASTEXITCODE) { Write-Host "::error::host import failed"; exit 1 }
          exit 0

      - name: Upgrade from a 0.1 layout keeps the old task path working
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          $dir = Join-Path $env:RUNNER_TEMP 'winuse-old'
          # fake a 0.1 install: files under agent\ (a 0.1 task starts agent\winuse_agent.py)
          New-Item -ItemType Directory -Force (Join-Path $dir 'agent') | Out-Null
          Set-Content (Join-Path $dir 'agent\winuse_agent.py') 'raise SystemExit("old 0.1 code must not run")'
          Set-Content (Join-Path $dir 'agent\winuse_core.py') '# old'
          powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts\install.ps1 -Source $PWD -InstallDir $dir -NoTask
          if ($LASTEXITCODE) { Write-Host "::error::installer exited $LASTEXITCODE"; exit 1 }
          if (Test-Path (Join-Path $dir 'agent\winuse_core.py')) { Write-Host '::error::old files left in agent\'; exit 1 }
          $shim = Get-Content -Raw (Join-Path $dir 'agent\winuse_agent.py')
          if ($shim -notmatch 'runpy') { Write-Host '::error::agent\winuse_agent.py is not the shim'; exit 1 }
          # the shim must start the host: run it with a bogus token file so the host exits right after loading
          $py = Join-Path $dir 'venv\Scripts\python.exe'
          Set-Content (Join-Path $dir 'token.txt') 'short'
          $out = & $py (Join-Path $dir 'agent\winuse_agent.py') --console 2>&1 | Out-String
          if ($out -notmatch 'token.txt is missing or too short') { Write-Host "::error::shim did not reach the host: $out"; exit 1 }
          Write-Host 'shim reaches the host'
          exit 0

  agent-machine:
    name: Linux (CLI + install.sh)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: install.sh syntax
        run: sh -n site/install.sh
      - name: CLI runs
        run: |
          bin/winuse --version
          bin/winuse --help > /dev/null
          python -m py_compile bin/winuse-mcp
